name: Pull Request Build & Lint

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Build binaries
        run: make build

      - name: Validate Docker builds
        run: |
          TAG=pr-${{ github.event.number }} make docker-build
          TAG=pr-${{ github.event.pull_request.head.sha }} make docker-build
