name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binaries
        run: make build

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            sorter
            sorter-web

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version tag
        id: bump
        env:
          VERSION_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 | sed 's/^v//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          if [ -z "$VERSION_BUMP" ]; then
            PUSH_MESSAGES="$COMMIT_MESSAGE"

            if [ -n "$COMMITS_JSON" ] && command -v jq >/dev/null 2>&1; then
              EXTRA_MESSAGES=$(printf '%s' "$COMMITS_JSON" | jq -r '.[].message // empty')
              PUSH_MESSAGES=$(printf '%s\n%s' "$PUSH_MESSAGES" "$EXTRA_MESSAGES")
            fi

            case "$PUSH_MESSAGES" in
              *"[major]"*|*"#major"*)
                VERSION_BUMP=major
                ;;
              *"[minor]"*|*"#minor"*)
                VERSION_BUMP=minor
                ;;
              *"[patch]"*|*"#patch"*)
                VERSION_BUMP=patch
                ;;
              *)
                VERSION_BUMP=patch
                ;;
            esac
          fi

          case "$VERSION_BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported version bump: $VERSION_BUMP"
              exit 1
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}
   
      - name: Build Docker image
        run: |
          TAG=${{ steps.bump.outputs.new_tag }} make docker-push
          TAG=latest make docker-push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          files: |
            sorter
            sorter-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
